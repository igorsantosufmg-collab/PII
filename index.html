<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layout Marketplace</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1d1026">

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>

<style>
  :root {
    --noite: #1d1026;
    --nevoa: #35234a;
    --osso: #f0e8d4;
    --abobora: #ff7a1a;
    --abobora-escura: #c24f00;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, var(--nevoa) 0%, var(--noite) 72%);
  }

  model-viewer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    --poster-color: transparent;
    background: transparent;
    outline: none;
  }

  .trilho {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(60%, 260px);
    height: 6px;
    transform: translate(-50%, -50%);
    border-radius: 999px;
    background: rgba(240, 232, 212, 0.18);
    overflow: hidden;
    transition: opacity 0.4s ease;
  }
  .barra {
    height: 100%;
    width: 0%;
    background: var(--abobora);
    border-radius: inherit;
    transition: width 0.2s ease;
  }
  .trilho.oculto { opacity: 0; pointer-events: none; }

  .erro {
    position: fixed;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    width: min(86%, 420px);
    margin: 0;
    padding: 16px 18px;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.5);
    color: var(--osso);
    font: 500 1rem/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .erro[hidden] { display: none; }

  .botao-sv {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
    transform: translateX(-50%);
    width: min(88%, 380px);
    padding: 14px 20px;
    border-radius: 16px;
    border: 2px solid var(--abobora);
    color: var(--osso);
    background: rgba(29, 16, 38, 0.85);
    font: 600 1rem/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    text-decoration: none;
    z-index: 5;
  }
  .botao-sv[hidden] { display: none; }

  .diag {
    position: fixed;
    left: 12px;
    right: 12px;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    margin: 0;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.6);
    color: #e8e3d6;
    font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    z-index: 6;
  }
  .diag[hidden] { display: none; }

  .botao-ar {
    position: absolute;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    transform: translateX(-50%);
    width: min(88%, 380px);
    padding: 17px 24px;
    border: 0;
    border-radius: 18px;
    background: var(--abobora);
    color: #1d1026;
    font: 700 1.1rem/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--abobora-escura);
    -webkit-tap-highlight-color: transparent;
  }
  .botao-ar:active {
    transform: translateX(-50%) translateY(4px);
    box-shadow: 0 2px 0 var(--abobora-escura);
  }
  .botao-ar:focus-visible {
    outline: 3px solid var(--osso);
    outline-offset: 4px;
  }
</style>
</head>
<body>

  <model-viewer
    src="layout-marketplace-mesa-android.glb"
    ios-src="layout-marketplace-mesa.usdz"
    camera-orbit="-35deg 60deg auto"
    alt="Maquete 3D do layout do marketplace"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    ar-placement="floor"
    camera-controls
    interaction-prompt="none"
    shadow-intensity="1"
    shadow-softness="0.8"
    environment-image="neutral"
    exposure="1.1"
    loading="eager"
    reveal="auto">

    <div class="trilho" slot="progress-bar"><div class="barra" id="barra"></div></div>

    <button class="botao-ar" slot="ar-button">Ver na mesa</button>
  </model-viewer>

  <p class="erro" id="erro" hidden></p>
  <a class="botao-sv" id="sv" hidden>Abrir em RA no Android</a>
  <pre class="diag" id="diag" hidden></pre>

  <script>
    var viewer = document.querySelector("model-viewer");
    var trilho = document.querySelector(".trilho");
    var barra = document.getElementById("barra");
    var erro = document.getElementById("erro");
    var diag = document.getElementById("diag");
    var sv = document.getElementById("sv");
    var android = /Android/i.test(navigator.userAgent);
    var estado = { progresso: 0, carregou: false, erro: "" };

    function infoGPU() {
      try {
        var c = document.createElement("canvas");
        var gl = c.getContext("webgl2");
        var v = gl ? "sim" : "não";
        var g = gl || c.getContext("webgl");
        var ext = g && g.getExtension("WEBGL_debug_renderer_info");
        var r = ext ? g.getParameter(ext.UNMASKED_RENDERER_WEBGL) : "desconhecida";
        return "WebGL2: " + v + " | GPU: " + r;
      } catch (e) { return "WebGL: erro ao consultar (" + e.message + ")"; }
    }
    function mostrarDiag() {
      var ua = navigator.userAgent.match(/(Android [\d.]+|iPhone OS [\d_]+|Chrome\/[\d.]+|Version\/[\d.]+)/g) || [];
      diag.textContent =
        "Diagnóstico\n" +
        "Sistema/navegador: " + ua.join(" | ") + "\n" +
        infoGPU() + "\n" +
        "Carregamento: " + Math.round(estado.progresso * 100) + "% | carregou: " + (estado.carregou ? "sim" : "não") + "\n" +
        "RA disponível na página: " + (viewer.canActivateAR ? "sim" : "não") + "\n" +
        (estado.erro ? "Erro: " + estado.erro : "Erro: nenhum registrado");
      diag.hidden = false;
    }
    function esconderBarra() { trilho.classList.add("oculto"); }

    viewer.addEventListener("progress", function (e) {
      estado.progresso = e.detail.totalProgress;
      barra.style.width = Math.round(estado.progresso * 100) + "%";
      if (estado.progresso >= 1) esconderBarra();
    });
    viewer.addEventListener("load", function () {
      estado.carregou = true; esconderBarra();
      if (!diag.hidden) mostrarDiag();
    });
    viewer.addEventListener("error", function (e) {
      esconderBarra();
      var d = e.detail || {};
      estado.erro = (d.type || "erro") + (d.sourceError ? " – " + (d.sourceError.message || d.sourceError) : "");
      var nome = (viewer.getAttribute("src") || "").split("/").pop();
      erro.textContent = "Não foi possível carregar “" + nome + "”.";
      erro.hidden = false;
      mostrarDiag();
    });
    window.addEventListener("error", function (e) {
      estado.erro = (estado.erro ? estado.erro + " | " : "") + (e.message || "erro de script");
      if (android) mostrarDiag();
    });

    if (android) {
      var glb = new URL(viewer.getAttribute("src"), location.href).href;
      sv.href = "intent://arvr.google.com/scene-viewer/1.0?file=" + encodeURIComponent(glb) +
        "&mode=ar_preferred&resizable=false&title=" + encodeURIComponent("Layout Marketplace") +
        "#Intent;scheme=https;package=com.google.android.googlequicksearchbox;" +
        "action=android.intent.action.VIEW;S.browser_fallback_url=" + encodeURIComponent(location.href) + ";end;";
      sv.hidden = false;
      setTimeout(function () { if (!estado.carregou) mostrarDiag(); }, 15000);
    }
    if (location.hash === "#diag") setTimeout(mostrarDiag, 3000);
  </script>
</body>
</html>
